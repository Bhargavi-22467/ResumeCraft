<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Resume - ResumeCraft</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ResumeCraft
        </div>

        <a href="/" class="nav-button">
            Home
        </a>

    </nav>


    <main class="builder-container">

        <h1>Create Your Resume</h1>

        <p class="subtitle">
            Fill in your details below.
        </p>


        <form action="/create"
              method="POST"
              class="resume-form">


            <section class="form-section">

                <h2>Personal Information</h2>

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >


                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="+91 XXXXX XXXXX"
                >


                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    placeholder="Hyderabad, India"
                >


                <label>LinkedIn</label>

                <input
                    type="text"
                    name="linkedin"
                    placeholder="linkedin.com/in/username"
                >


                <label>GitHub</label>

                <input
                    type="text"
                    name="github"
                    placeholder="github.com/username"
                >

            </section>


            <section class="form-section">

                <h2>Professional Summary</h2>

                <textarea
                    name="summary"
                    rows="5"
                    placeholder="Write a short professional summary..."
                ></textarea>

            </section>


            <section class="form-section">

                <h2>Education</h2>

                <textarea
                    name="education"
                    rows="5"
                    placeholder="B.Tech in Computer Science - XYZ University - 2026"
                ></textarea>

            </section>


            <section class="form-section">

                <h2>Skills</h2>

                <textarea
                    name="skills"
                    rows="4"
                    placeholder="Python, Machine Learning, SQL, Flask, HTML, CSS"
                ></textarea>

            </section>


            <section class="form-section">

                <h2>Experience / Internship</h2>

                <textarea
                    name="experience"
                    rows="6"
                    placeholder="Company - Role - Duration&#10;Worked on..."
                ></textarea>

            </section>


            <section class="form-section">

                <h2>Projects</h2>

                <textarea
                    name="projects"
                    rows="7"
                    placeholder="Project Name&#10;Description&#10;Technologies used..."
                ></textarea>

            </section>


            <section class="form-section">

                <h2>Certifications</h2>

                <textarea
                    name="certifications"
                    rows="5"
                    placeholder="Python Certification - Coursera"
                ></textarea>

            </section>


            <section class="form-section">

                <h2>Achievements</h2>

                <textarea
                    name="achievements"
                    rows="5"
                    placeholder="Hackathon finalist..."
                ></textarea>

            </section>


            <section class="form-section">

                <h2>Choose Template</h2>

                <select name="template">

                    <option value="modern">
                        Modern
                    </option>

                    <option value="professional">
                        Professional
                    </option>

                    <option value="minimal">
                        Minimal
                    </option>

                </select>

            </section>


            <button
                type="submit"
                class="primary-button full-width">

                Generate Resume

            </button>

        </form>

    </main>


    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
